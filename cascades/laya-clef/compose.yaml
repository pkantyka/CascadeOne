name: cascadeone-community-laya-clef
x-common: &common
  platform: linux/arm64
  build:
    context: ../..
    dockerfile: cascades/laya-clef/Dockerfile
    args:
      CUDA_BASE: "${CASCADEONE_CUDA_BASE:?Provide a pinned ARM64 NVIDIA CUDA image digest}"
  image: cascadeone-community-laya-clef:v0.1
  working_dir: /workspace
  gpus: all
  ipc: host
  shm_size: "8gb"
  init: true
  restart: "no"
  environment:
    PYTHONPATH: /workspace/src
    HF_HOME: /cache/huggingface
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../..:/workspace
    - ${HOME}/.cache/huggingface:/cache/huggingface
services:
  fast:
    <<: *common
    command: [python, cascades/laya-clef/serve_backend.py, --which, fast]
  strong:
    <<: *common
    command: [python, cascades/laya-clef/serve_backend.py, --which, strong]
  benchmark:
    image: python:3.12-slim
    gpus: all
    working_dir: /workspace
    profiles: [benchmark]
    volumes: ["../..:/workspace"]
    command: [python, benchmarks/runner.py, --cascade, cascades/laya-clef/benchmark.json, --dataset-id, smoke-general-v1, --dataset-split, test, --output, output/laya-smoke]
