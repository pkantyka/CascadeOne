name: cascadeone-community-basal-pico-ultra-confidence
x-common: &common
  platform: linux/arm64
  working_dir: /workspace
  gpus: all
  ipc: host
  shm_size: "8gb"
  init: true
  restart: "no"
  environment:
    HF_HOME: /root/.cache/huggingface
    PYTHONUNBUFFERED: "1"
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
services:
  fast:
    <<: *common
    image: cascadeone-community-pico:basal232
    build:
      context: ../../..
      dockerfile: cascades/basal-pico-ultra/Dockerfile.pico
      args:
        CUDA_BASE: "${CASCADEONE_CUDA_BASE:-nvcr.io/nvidia/vllm:26.07-py3}"
    command:
      [basal-serve, --model, Remek/basal-omni-pico,
       --revision, b31750af3ef1b45adfa765f73edbb84b5362983a,
       --mode, eager, --orders, "1", --host, 0.0.0.0,
       --port, "18357", --mcp, "off"]
  strong:
    <<: *common
    image: cascadeone-community-ultra:basal210
    build:
      context: ../../..
      dockerfile: cascades/basal-pico-ultra/Dockerfile.ultra
      args:
        CUDA_BASE: "${CASCADEONE_CUDA_BASE:-nvcr.io/nvidia/vllm:26.07-py3}"
    command:
      [basal-serve, --model, Remek/basal-omni-1.0-ultra,
       --revision, b8e214cb42d0a7a4cb2c3a93b0ba02c65d7590e4,
       --mode, eager, --orders, "1", --host, 0.0.0.0,
       --port, "18357", --mcp, "off"]
  benchmark:
    image: cascadeone-community-benchmark:pyarrow21
    build:
      context: ../../..
      dockerfile: benchmarks/Dockerfile
    gpus: all
    working_dir: /workspace
    profiles: [benchmark]
    depends_on: [inference]
    environment: ["CASCADEONE_API_TOKEN"]
    volumes: ["../../..:/workspace"]
    command: [python, benchmarks/runner.py, --inference-url, http://inference:18358, --setup, benchmarks/smoke-general__basal-pico-ultra__confidence-min-t0p656352/benchmark.json, --output, output/pico-smoke]

  inference:
    image: cascadeone-community-inference:pyyaml602
    build:
      context: ../../..
      dockerfile: inference/Dockerfile
    profiles: [inference]
    depends_on: [fast, strong]
    working_dir: /workspace
    volumes: ["../../..:/workspace"]
    ports: ["127.0.0.1:18358:18358"]
    environment: ["CASCADEONE_BENCHMARK_RUN", "CASCADEONE_API_TOKEN", "CASCADEONE_BENCHMARK_MODE", "PYTHONUNBUFFERED=1"]
    command: [python, inference/server.py, --cascade, cascades/basal-pico-ultra/confidence/cascade.yaml, --host, 0.0.0.0, --port, "18358"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18358/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 120
