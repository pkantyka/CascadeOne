name: cascadeone-community-basal-pico-ultra
x-common: &common
  platform: linux/arm64
  working_dir: /workspace
  gpus: all
  ipc: host
  shm_size: "8gb"
  init: true
  restart: "no"
  environment:
    HF_HOME: /root/.cache/huggingface
    PYTHONUNBUFFERED: "1"
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
services:
  fast:
    <<: *common
    image: cascadeone-community-pico:basal232
    build:
      context: ../..
      dockerfile: cascades/basal-pico-ultra/Dockerfile.pico
    command:
      [basal-serve, --model, Remek/basal-omni-pico,
       --revision, b31750af3ef1b45adfa765f73edbb84b5362983a,
       --mode, eager, --orders, "1", --host, 0.0.0.0,
       --port, "18357", --mcp, "off"]
  strong:
    <<: *common
    image: cascadeone-community-ultra:basal210
    build:
      context: ../..
      dockerfile: cascades/basal-pico-ultra/Dockerfile.ultra
    command:
      [basal-serve, --model, Remek/basal-omni-1.0-ultra,
       --revision, b8e214cb42d0a7a4cb2c3a93b0ba02c65d7590e4,
       --mode, eager, --orders, "1", --host, 0.0.0.0,
       --port, "18357", --mcp, "off"]
  benchmark:
    image: cascadeone-community-benchmark:pyarrow21
    build:
      context: ../..
      dockerfile: cascades/basal-pico-ultra/Dockerfile.benchmark
    gpus: all
    working_dir: /workspace
    profiles: [benchmark]
    volumes: ["../..:/workspace"]
    command: [python, benchmarks/runner.py, --setup, benchmarks/smoke-general__basal-pico-ultra__confidence-min-t0p656352/benchmark.json, --output, output/pico-smoke]
